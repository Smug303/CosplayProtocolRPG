<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosplay Protocol: Save the RPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="crt-overlay"></div>
  </div>

  <div id="footer-controls">
    <div><span class="key-badge">Setas</span> / <span class="key-badge">WASD</span> Navegar</div>
    <div><span class="key-badge">Z</span> Confirmar / Atacar</div>
    <div><span class="key-badge">X</span> Voltar / Cancelar</div>
    <div><span class="key-badge">M</span> Mutar Áudio</div>
    <div><span class="key-badge">C</span> Filtro CRT</div>
  </div>

  <!-- Game Scripts (Zero-dependency Standalone Vanilla JS) -->
  <script src="js/skills.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
